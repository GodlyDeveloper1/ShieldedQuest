# Runs on every push: the tests, a signer compile check and a production build
# of the web app, from a clean machine. No secrets are used, and nothing here
# touches a wallet or the network beyond downloading dependencies.
#
# What this can't cover: the real flow (fund, solve, claim) needs a synced signer
# and testnet coins. That is tested by hand; see quest-web/DEMO.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: Hunt crypto (24 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quest-crypto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quest-crypto/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Web app (type check and production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            quest-crypto/package-lock.json
            quest-web/package-lock.json
      - name: Install quest-crypto (the web app links to it)
        run: npm ci
        working-directory: quest-crypto
      - run: npm ci
        working-directory: quest-web
      - name: The browser key module is committed
        run: test -s public/wasm/pot_keys.js && test -s public/wasm/pot_keys_bg.wasm && test -s public/wasm/expose.js
        working-directory: quest-web
      - run: npm run typecheck
        working-directory: quest-web
      - run: npm run build
        working-directory: quest-web

  pot-keys:
    name: Browser key module (5 tests, WebAssembly build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pot-keys
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pot-keys
      # Includes the check that this module derives exactly the viewing key the
      # signer's own library derives from the same seed phrase.
      - run: cargo test --locked
      # The module must build for the browser in pure Rust, with no C compiler.
      - run: cargo build --release --locked --target wasm32-unknown-unknown

  signer:
    name: Signer compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: signer
      - run: cargo check --locked
