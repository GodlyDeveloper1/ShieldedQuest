# TESTNET ONLY. Based on Zebra's official docker/docker-compose.lwd.yml, switched from
# Mainnet (8232/8233) to Testnet (18232/18233) and slimmed down to run on a laptop.
services:
  zebra:
    container_name: zebra
    image: zfnd/zebra          # pin a release tag from hub.docker.com/r/zfnd/zebra/tags once you've picked one
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - zebrad-cache:/home/zebra/.cache/zebra
    tty: true
    environment:
      - ZEBRA_NETWORK__NETWORK=Testnet
      - ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:18232
      - ZEBRA_RPC__ENABLE_COOKIE_AUTH=false   # lightwalletd doesn't support cookie auth

  lightwalletd:
    image: electriccoinco/lightwalletd
    platform: linux/amd64
    container_name: lightwalletd
    depends_on:
      zebra:
        condition: service_started
    restart: unless-stopped
    environment:
      - LWD_GRPC_PORT=9067
      - LWD_HTTP_PORT=9068
    configs:
      - source: lwd_config
        target: /etc/lightwalletd/zcash.conf
    volumes:
      - lwd-cache:/var/lib/lightwalletd/db
    command: >
      --no-tls-very-insecure
      --grpc-bind-addr=0.0.0.0:9067
      --http-bind-addr=0.0.0.0:9068
      --zcash-conf-path=/etc/lightwalletd/zcash.conf
      --data-dir=/var/lib/lightwalletd/db
      --log-file=/dev/stdout
      --log-level=7
    ports:
      - "127.0.0.1:9067:9067"
      - "127.0.0.1:9068:9068"

configs:
  lwd_config:
    file: ./zcash.conf

volumes:
  zebrad-cache:
    driver: local
  lwd-cache:
    driver: local
